<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원라인 무비 V4</title>

<style>
:root{
  --bg:#0b0b0c;
  --card:#131316;
  --text:#f4f4f5;
  --muted:#b2b2bb;
  --line:#23232a;
  --accent:#16a34a;
  --accent2:#22c55e;
  --danger:#ef4444;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  background:
    radial-gradient(1200px 800px at 50% -200px, rgba(34,197,94,.18), transparent 60%),
    radial-gradient(900px 700px at 10% 10%, rgba(59,130,246,.10), transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:22px;
  display:flex;
  justify-content:center;
}
.wrap{width:100%;max-width:1120px}

/* ===== HERO LINE ===== */
.hero-line{
  font-size:26px;
  font-weight:900;
  text-align:center;
  margin:6px 0 18px;
  letter-spacing:-0.03em;
}

/* ===== TOP ===== */
.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:12px;
}
.brand h1{margin:0;font-size:26px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.pill{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  font-size:12px;
  color:var(--muted);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:14px;
}
@media(max-width:980px){
  .grid{grid-template-columns:1fr}
}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.cardHeader{
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cardHeader h2{margin:0;font-size:14px;color:var(--muted)}
.cardBody{padding:14px}

textarea{
  width:100%;
  min-height:120px;
  background:#0f0f12;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  color:var(--text);
  font-size:16px;
  resize:none;
}
textarea::placeholder{color:#7b7b86}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.control{flex:1 1 160px}
.k{font-size:12px;color:var(--muted);margin-bottom:6px}

select,input{
  width:100%;
  height:44px;
  background:#0f0f12;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 12px;
  color:var(--text);
}

.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{
  height:52px;
  border-radius:14px;
  border:none;
  font-weight:900;
  cursor:pointer;
}
.primary{
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  color:#07150b;
  flex:1;
}
.ghost{
  background:rgba(255,255,255,.04);
  color:var(--text);
  border:1px solid var(--line);
  flex:1;
}
.danger{
  background:rgba(239,68,68,.12);
  color:#fecaca;
  border:1px solid rgba(239,68,68,.25);
  flex:1;
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--muted);
}

.out{
  padding:14px;
  display:grid;
  gap:12px;
}
.scene{
  background:#0f0f12;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
.scene b{font-size:14px}
.box{
  white-space:pre-wrap;
  background:#0b0b0c;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  font-size:13px;
  margin-top:6px;
}
.footer{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

/* ===== HERO 위치용 ===== */
.hero-holder{
  margin-bottom:8px;
}
</style>
</head>

<body>
<div class="wrap">

  <!-- HERO -->
  <div class="hero-holder">
    <div class="hero-line">한 줄을 쓰면, 그 순간 영화가 된다.</div>
  </div>

  <div class="top">
    <div class="brand">
      <h1>🎬 원라인 무비 <span style="opacity:.6">V4</span></h1>
      <p>한 줄 입력 → 장면 설계 + 프롬프트 + SRT + ZIP</p>
    </div>
    <div class="pill">GitHub Pages · 서버 없이</div>
  </div>

  <div class="grid">
    <!-- INPUT -->
    <div class="card">
      <div class="cardHeader">
        <h2>입력</h2>
        <span class="badge" id="status">대기중</span>
      </div>
      <div class="cardBody">
        <textarea id="line" placeholder="예: 비 오는 밤, 말을 하지 않는 강아지 탐정"></textarea>

        <div class="row">
          <div class="control">
            <div class="k">장르</div>
            <select id="genre">
              <option value="mystery">미스터리</option>
              <option value="thriller">스릴러</option>
              <option value="sf">SF</option>
              <option value="fantasy">판타지</option>
              <option value="romance">로맨스</option>
              <option value="horror">공포</option>
              <option value="comedy">코미디</option>
            </select>
          </div>
          <div class="control">
            <div class="k">길이</div>
            <select id="length">
              <option value="30">30초</option>
              <option value="60" selected>60초</option>
              <option value="180">3분</option>
            </select>
          </div>
        </div>

        <div class="btnRow">
          <button class="primary" id="make">⚡ 영화 설계 만들기</button>
          <button class="ghost" id="copy">📋 Copy All</button>
          <button class="ghost" id="zip">🗂 ZIP</button>
          <button class="danger" id="reset">🧹 초기화</button>
        </div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <div class="cardHeader">
        <h2>출력</h2>
      </div>
      <div class="out" id="out"></div>
    </div>
  </div>

  <div class="footer">© 원라인 무비 V4 · 한 파일 완성형</div>
</div>

<script>
const beats = [
  "오프닝 훅 — 단서가 되는 장면",
  "이상 징후 — 평범함이 깨진다",
  "위험 제시 — 왜 위험한가",
  "첫 선택 — 주인공의 행동",
  "숨겨진 규칙 — 반전의 조건",
  "최대 위기 — 실패 직전",
  "실마리 — 작은 힌트",
  "반전 — 진실 공개",
  "엔딩 — 여운"
];

const out = document.getElementById("out");
const status = document.getElementById("status");

document.getElementById("make").onclick = () => {
  const line = document.getElementById("line").value.trim();
  if(!line){alert("한 줄 써줘!");return;}
  status.textContent="생성중…";
  out.innerHTML="";
  beats.forEach((b,i)=>{
    const d=document.createElement("div");
    d.className="scene";
    d.innerHTML=`<b>SCENE ${i+1}</b><div class="box">${b}</div>`;
    out.appendChild(d);
  });
  status.textContent="완료";
};

document.getElementById("copy").onclick=()=>{
  navigator.clipboard.writeText(out.innerText);
  status.textContent="복사됨";
};

document.getElementById("reset").onclick=()=>{
  document.getElementById("line").value="";
  out.innerHTML="";
  status.textContent="대기중";
};
</script>

</body>
</html>
